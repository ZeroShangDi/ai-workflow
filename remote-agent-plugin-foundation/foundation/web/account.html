<section id="account">
  <h2>登录或创建账号</h2>
  <form id="account-form">
    <label
      >姓名（注册时填写）<input name="name" autocomplete="name" maxlength="100"
    /></label>
    <label
      >邮箱<input name="email" type="email" autocomplete="email" required
    /></label>
    <label
      >密码（至少 12 位）<input
        name="password"
        type="password"
        autocomplete="current-password"
        minlength="12"
        required
    /></label>
    <div>
      <button name="action" value="sign-in">登录</button
      ><button name="action" value="sign-up">注册</button>
    </div>
  </form>
</section>
