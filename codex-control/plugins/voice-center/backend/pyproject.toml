[project]
name = "voice-center-backend"
version = "0.1.0"
description = "Self-contained Pipecat voice core and capability tools for Voice Center."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pipecat-ai[webrtc,silero,openai]==1.12.0",
  "uvicorn>=0.34,<1",
  "websockets>=15,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_center_backend"]
