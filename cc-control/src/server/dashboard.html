<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWF Run — Dashboard</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161822; --border: #252836;
    --text: #c9d1d9; --dim: #6e7681; --accent: #58a6ff;
    --done: #3fb950; --active: #d29922; --pending: #484f58;
    --danger: #f85149; --phase-active: #58a6ff; --phase-done: #3fb950;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif; height:100vh; display:flex; flex-direction:column; }

  /* top bar */
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); }
  .topbar .project { font-size:16px; font-weight:600; }
  .topbar .phase { padding:2px 12px; border-radius:12px; font-size:12px; font-weight:600; background:var(--phase-active); color:#fff; }
  .topbar .mode { padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; background:var(--pending); color:var(--dim); text-transform:uppercase; }
  .topbar .run-toggle { padding:3px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
  .topbar .run-toggle.start { background:var(--done); color:#000; }
  .topbar .run-toggle.stop { background:#7f1d1d; color:#fff; }
  .topbar .run-toggle:hover { opacity:.9; }
  .topbar .diagnose { padding:3px 12px; border:1px solid #31577e; border-radius:8px; background:transparent; color:var(--accent); font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  .topbar .diagnose:hover { background:rgba(88,166,255,.1); }
  .topbar .diagnose:disabled { opacity:.5; cursor:wait; }
  .topbar .diagnostics-link { color:var(--dim); font-size:12px; text-decoration:none; }
  .topbar .diagnostics-link:hover { color:var(--accent); }
  .topbar .progress { margin-left:auto; font-size:13px; color:var(--dim); }
  .topbar .progress span { color:var(--text); font-weight:600; }

  /* metrics strip */
  .phase-chain {
    display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:10px;
    padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .metric {
    min-width:0; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    background:rgba(255,255,255,.02);
  }
  .metric-label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.8px; }
  .metric-value { margin-top:4px; font-size:18px; font-weight:700; color:var(--text); }
  .metric-meta { margin-top:3px; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width: 1100px) { .phase-chain { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .phase-chain { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .phase-chain { grid-template-columns:1fr; } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* main */
  .main { display:flex; flex:1; overflow:hidden; }

  /* tasks panel */
  .tasks { width:280px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:12px; flex-shrink:0; }
  .tasks h3 { font-size:12px; text-transform:uppercase; color:var(--dim); margin-bottom:8px; letter-spacing:1px; }
  .task-item { display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:6px; margin-bottom:2px; cursor:default; transition:background .15s; }
  .task-item:hover { background:rgba(255,255,255,.04); }
  .task-item .icon { font-size:14px; line-height:1.4; flex-shrink:0; }
  .task-item .icon.done { color:var(--done); }
  .task-item .icon.active { color:var(--active); }
  .task-item .icon.pending { color:var(--pending); }
  .task-item .icon.blocked { color:var(--danger); }
  .task-item .info { flex:1; min-width:0; }
  .task-item .name { font-size:13px; display:block; }
  .task-item .name.done { text-decoration:line-through; color:var(--dim); }
  .task-item .name.blocked { color:var(--danger); }
  .task-item .deps { font-size:11px; color:var(--dim); }
  .task-item .duration { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .task-item.current { background:rgba(88,166,255,.08); border:1px solid rgba(88,166,255,.2); }
  .tasks .empty { color:var(--dim); font-style:italic; padding:4px 10px; }

  /* output area */
  .output { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .output-header { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--border); }
  .output-header h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .output-header .status { font-size:11px; padding:1px 8px; border-radius:8px; }
  .output-header .status.online { background:var(--done); color:#000; }
  .output-header .status.busy { background:var(--active); color:#000; }
  .output-header .status.offline { background:var(--pending); color:var(--text); }
  .output-content { flex:1; overflow-y:auto; padding:16px; font:13px/1.7 'SF Mono',Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
  .output-content .empty { color:var(--dim); font-style:italic; }

  /* decision panel */
  .decision { padding:10px 16px; background:#1c1f2a; border-top:1px solid var(--border); }
  .decision-q { font-size:13px; font-weight:600; margin-bottom:6px; }
  .decision-opts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .decision-opts button { background:#1f2937; color:var(--text); border:1px solid #313d4d; border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  .decision-opts button:hover { background:#273244; }
  .decision-opts button.sel { background:var(--accent); color:#000; border-color:var(--accent); }
  .decision-opts button.confirm { background:var(--done); color:#000; border-color:var(--done); font-weight:600; }
  .decision-row { display:flex; gap:8px; }
  .decision-row input { flex:1; background:#0b0f15; color:var(--text); border:1px solid var(--border); border-radius:7px; padding:8px 12px; font:inherit; }
  .decision-row input:focus { outline:none; border-color:var(--accent); }

  /* input bar */
  .input-bar { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-top:1px solid var(--border); }
  .input-bar input { flex:1; background:#0b0f15; color:var(--text); border:1px solid var(--border); border-radius:7px; padding:9px 12px; font:inherit; }
  .input-bar input:focus { outline:none; border-color:var(--accent); }
  .input-bar button, .decision-row button { background:var(--accent); color:#000; border:none; border-radius:7px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .input-bar button:hover, .decision-row button:hover { opacity:.9; }
  .input-bar button.stop { background:var(--danger); color:#fff; }
  .input-bar input:disabled { opacity:.45; cursor:not-allowed; }

  .error { display:none; padding:8px 16px; background:#490202; color:#f85149; font-size:12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="project" id="projectName">—</div>
  <div class="phase" id="currentPhase">—</div>
  <div class="mode" id="modePill">idle</div>
  <button id="runToggle" class="run-toggle start" onclick="toggleRun()">启动</button>
  <button id="diagnoseBtn" class="diagnose" onclick="requestDiagnosis()">诊断本次运行</button>
  <a class="diagnostics-link" href="/diagnostics">查看详情</a>
  <div class="progress">Task <span id="progress">0/0</span></div>
</div>
<div class="phase-chain" id="phaseChain"></div>
<div class="error" id="errorBar"></div>

<div class="main">
  <div class="tasks" id="taskList">
    <h3>Tasks</h3>
  </div>
  <div class="output">
    <div class="output-header">
      <h3>消息</h3>
      <div class="status" id="connStatus">连接中</div>
    </div>
    <div class="output-content" id="output"></div>
  </div>
</div>

<div class="decision" id="decisionPanel" style="display:none">
  <div class="decision-q" id="decisionQuestion"></div>
  <div class="decision-opts" id="decisionOptions"></div>
  <div class="decision-row">
    <input type="text" id="decisionInput" placeholder="自定义输入…" />
    <button onclick="respondInput()">回应</button>
  </div>
</div>

<div class="input-bar" id="inputBar">
  <input type="text" id="cmdInput" placeholder="输入指令控制流程（发送给 tmux 中的 Claude）…" />
  <button id="sendBtn" onclick="handleSendOrStop()">发送 ↵</button>
</div>

<script>
// 权威阶段枚举（见 awf_phase MCP tool / w-state.md）：
// IDLE | PLAN | DESIGN | CODE | REVIEW | TEST | COMMIT | FINISH | DEBUG
const PHASE_LABELS = {
  IDLE:'待开始', PLAN:'规划', DESIGN:'设计', CODE:'开发', DEV:'开发', DEBUG:'调试',
  DOCS:'文档', REVIEW:'审查', TEST:'测试', COMMIT:'提交', FINISH:'收尾'
};
const MODE_LABEL = { idle:'idle', plan:'plan', run:'run', pause:'pause' };
const TASK_ICON = { done:'✓', active:'●', blocked:'⚠', pending:'○' };
const TASK_CLS  = { done:'done', active:'active', blocked:'blocked', pending:'pending' };

// 归一化阶段别名：DEBUG/DOCS/DEV 都是 CODE 阶段的子状态（回环/插入），统一落到 CODE 位置
function canon(p) {
  if (p === 'DEBUG' || p === 'DOCS' || p === 'DEV') return 'CODE';
  return p;
}

let lastSnapshot = '';
let currentDecision = null;
let autoScroll = true;
let currentMode = 'idle';
let isBusy = false;
let lastMetrics = null;
let lastState = null;

function showError(msg) {
  document.getElementById('errorBar').style.display = 'block';
  document.getElementById('errorBar').textContent = msg;
}

async function refresh() {
  try {
    const sr = await fetch('/awf/state');
    if (!sr.ok) {
      showError('state.json 未找到');
    } else {
      document.getElementById('errorBar').style.display = 'none';
      const state = await sr.json();
      lastState = state;
      renderState(state);
    }

    const mr = await fetch('/awf/metrics');
    const mj = await mr.json();
    if (mr.ok && mj.metrics) {
      lastMetrics = mj.metrics;
      renderMetrics(mj.metrics);
    }

    const ssr = await fetch('/status?snapshot=true');
    const ss = await ssr.json();
    renderConn(ssr.ok, ss);
    renderDecision(ss.decisionPending);

    if (ss.snapshot && ss.snapshot !== lastSnapshot) {
      lastSnapshot = ss.snapshot;
      const out = document.getElementById('output');
      out.textContent = ss.snapshot.replace(/\n+$/, '');
      if (autoScroll) out.scrollTop = out.scrollHeight;
    }
  } catch (e) {
    renderConn(false, {});
  }
}

function renderConn(ok, ss) {
  const el = document.getElementById('connStatus');
  if (!ok) { el.className = 'status offline'; el.textContent = '离线'; }
  else if (!ss.session) { el.className = 'status offline'; el.textContent = '无会话'; }
  else if (ss.state === 'busy') { el.className = 'status busy'; el.textContent = '执行中'; }
  else { el.className = 'status online'; el.textContent = '就绪'; }
  isBusy = !!ok && !!ss.session && ss.state === 'busy';
  renderSendButton();
}

function renderState(state) {
  document.getElementById('projectName').textContent = (state.plan && state.plan.summary) || state.project || state.task || '—';
  const phase = state.currentState || 'IDLE';
  document.getElementById('currentPhase').textContent = PHASE_LABELS[phase] || phase;
  document.getElementById('modePill').textContent = MODE_LABEL[state.mode] || 'idle';
  renderRunToggle(state.mode);

  // tasks
  const tasks = state.tasks || [];
  const done = tasks.filter(t => t.status === 'done').length;
  document.getElementById('progress').textContent = done + '/' + tasks.length;

  const list = document.getElementById('taskList');
  list.innerHTML = '<h3>Tasks</h3>';
  if (!tasks.length) list.insertAdjacentHTML('beforeend', '<div class="empty">暂无任务</div>');
  tasks.forEach(t => {
    const cls = TASK_CLS[t.status] || 'pending';
    const icon = TASK_ICON[t.status] || '○';
    const div = document.createElement('div');
    div.className = 'task-item' + (t.status === 'active' ? ' current' : '');
    div.innerHTML = `<span class="icon ${cls}">${icon}</span>
      <div class="info">
        <span class="name ${cls}">[${t.id}] ${t.title || t.desc || t.id}</span>
        ${taskDuration(t) ? '<span class="duration">耗时 ' + taskDuration(t) + '</span>' : ''}
        ${t.deps && t.deps.length ? '<span class="deps">← [' + t.deps.join(',') + ']</span>' : ''}
      </div>`;
    list.appendChild(div);
  });

  if (!lastMetrics) renderMetrics(null);
}

function taskDuration(task) {
  const started = Date.parse(task.exec && task.exec.startedAt);
  if (!Number.isFinite(started)) return '';
  const completed = Date.parse(task.exec && task.exec.completedAt);
  const seconds = Math.max(0, Math.floor(((Number.isFinite(completed) ? completed : Date.now()) - started) / 1000));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  if (hours) return hours + 'h ' + String(minutes).padStart(2, '0') + 'm ' + String(rest).padStart(2, '0') + 's';
  if (minutes) return minutes + 'm ' + String(rest).padStart(2, '0') + 's';
  return rest + 's';
}

function formatCompactNumber(value) {
  if (typeof value !== 'number' || !Number.isFinite(value) || value <= 0) return '—';
  if (value >= 1000000) return (value / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (value >= 1000) return (value / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(Math.round(value));
}

function formatSpeed(value) {
  if (typeof value !== 'number' || !Number.isFinite(value) || value <= 0) return '—';
  return value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2).replace(/\.0$/, '') + ' tok/s';
}

function formatElapsed(ms) {
  if (typeof ms !== 'number' || !Number.isFinite(ms) || ms < 0) return '—';
  const seconds = Math.floor(ms / 1000);
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  if (hours) return hours + 'h ' + String(minutes).padStart(2, '0') + 'm ' + String(rest).padStart(2, '0') + 's';
  if (minutes) return minutes + 'm ' + String(rest).padStart(2, '0') + 's';
  return rest + 's';
}

function formatContext(metrics) {
  const ctx = metrics && metrics.context;
  if (!ctx) return { value: '—', meta: '未采集' };
  const pct = typeof ctx.usedPercentage === 'number' ? ctx.usedPercentage + '%' : '—';
  const total = typeof ctx.totalInputTokens === 'number' ? formatCompactNumber(ctx.totalInputTokens) : null;
  const size = typeof ctx.contextWindowSize === 'number' ? formatCompactNumber(ctx.contextWindowSize) : null;
  return {
    value: pct,
    meta: total && size ? `${total}/${size} tokens` : 'statusLine 未返回窗口明细',
  };
}

function renderMetrics(metrics) {
  const el = document.getElementById('phaseChain');
  if (!metrics) {
    el.innerHTML = [
      metricCard('总 Token', '—', '等待会话数据'),
      metricCard('输出 Token', '—', '等待会话数据'),
      metricCard('输出速度', '—', '等待会话数据'),
      metricCard('上下文', '—', '等待会话数据'),
      metricCard('总耗时', '—', '等待会话数据'),
      metricCard('Agent', '—', '等待会话数据'),
    ].join('');
    return;
  }

  const ctx = formatContext(metrics);
  const tokenMeta = metrics.tokens.coverage === 'exact'
    ? `${metrics.agentMode === 'multi' ? '多 Agent 聚合' : '单 Agent 精确'}`
    : metrics.tokens.coverage === 'partial'
      ? `部分统计 · ${metrics.activeAgents} 个运行中 Agent`
      : '暂无 transcript usage';
  const speedMeta = metrics.outputSpeed.basis === 'recent_60s'
    ? '最近 60s 端到端吞吐'
    : metrics.outputSpeed.basis === 'average'
      ? '全程端到端吞吐'
      : '暂无输出样本';
  const taskTotal = (lastState && lastState.tasks || []).length;
  const taskDone = (lastState && lastState.tasks || []).filter(task => task.status === 'done').length;
  const agentMeta = metrics.tokens.coverage === 'exact'
    ? `统计完整 · ${metrics.sources.subagentCount} 个子 Agent`
    : `覆盖 ${metrics.tokens.coveredTranscripts}/${metrics.tokens.totalTranscripts} 个 transcript`;

  el.innerHTML = [
    metricCard('总 Token', formatCompactNumber(metrics.tokens.total), tokenMeta),
    metricCard('输出 Token', formatCompactNumber(metrics.tokens.output), `输入 ${formatCompactNumber(metrics.tokens.input)} · 缓存未计入`),
    metricCard('输出速度', formatSpeed(metrics.outputSpeed.currentTokensPerSecond || metrics.outputSpeed.averageTokensPerSecond), speedMeta),
    metricCard('上下文', ctx.value, ctx.meta),
    metricCard('总耗时', formatElapsed(metrics.elapsedMs), `${metrics.state.currentPhase ? '当前阶段 ' + (PHASE_LABELS[metrics.state.currentPhase] || metrics.state.currentPhase) : '等待开始'}`),
    metricCard('Agent', `${metrics.activeAgents}/${metrics.maxAgents}`, taskTotal ? `任务 ${taskDone}/${taskTotal} · ${agentMeta}` : agentMeta),
  ].join('');
}

function metricCard(label, value, meta) {
  return `<div class="metric">
    <div class="metric-label">${label}</div>
    <div class="metric-value">${value}</div>
    <div class="metric-meta">${meta || ''}</div>
  </div>`;
}

async function requestDiagnosis() {
  const button = document.getElementById('diagnoseBtn');
  button.disabled = true;
  button.textContent = '正在提交诊断…';
  try {
    const res = await fetch('/awf/diagnostics', { method: 'POST' });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || '诊断提交失败');
    window.location.href = '/diagnostics';
  } catch (error) {
    showError(error.message);
    button.disabled = false;
    button.textContent = '诊断本次运行';
  }
}

function renderDecision(d) {
  const panel = document.getElementById('decisionPanel');
  const inputBar = document.getElementById('inputBar');
  currentDecision = d;
  if (!d || d.answered) {
    panel.style.display = 'none';
    inputBar.style.display = 'flex';
    return;
  }
  // 出现选择器时，输入框切换为选择样式，隐藏自由输入
  panel.style.display = 'block';
  inputBar.style.display = 'none';
  document.getElementById('decisionQuestion').textContent = d.question || '';
  const opts = document.getElementById('decisionOptions');
  opts.innerHTML = '';
  const isMulti = !!d.multiSelect;
  const selected = new Set();
  (d.options || []).forEach((o, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + o;
    if (isMulti) {
      b.onclick = () => {
        if (selected.has(i)) { selected.delete(i); b.classList.remove('sel'); }
        else { selected.add(i); b.classList.add('sel'); }
      };
    } else {
      b.onclick = () => respond(String(i + 1));
    }
    opts.appendChild(b);
  });
  if (isMulti) {
    const ok = document.createElement('button');
    ok.textContent = '确认';
    ok.className = 'confirm';
    ok.onclick = () => {
      if (selected.size === 0) return;
      respond([...selected].sort((a, b) => a - b).map(i => i + 1).join(','));
    };
    opts.appendChild(ok);
  }
}

async function respond(value) {
  if (value == null || String(value).trim() === '') return;
  const res = await fetch('/respond', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ value: String(value) }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) showError((data && data.error) || '回应失败');
  refresh();
}

async function respondInput() {
  const input = document.getElementById('decisionInput');
  const v = input.value;
  if (!v.trim()) return;
  input.value = '';
  await respond(v);
}

async function postSend(text) {
  const res = await fetch('/send', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) showError((data && data.error) || '发送失败');
  refresh();
}

async function postCmd(cmd) {
  const res = await fetch('/cmd', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ cmd }),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) showError((data && data.error) || '发送失败');
  refresh();
}

async function sendText() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await postSend(text);
}

async function postStop() {
  const res = await fetch('/stop', { method: 'POST' });
  const data = await res.json().catch(() => null);
  if (!res.ok) showError((data && data.error) || '停止失败');
  refresh();
}

// 发送/停止二合一：busy 时按钮变停止，ready 时发送
async function handleSendOrStop() {
  if (isBusy) { await postStop(); }
  else { await sendText(); }
}

function renderSendButton() {
  const btn = document.getElementById('sendBtn');
  const input = document.getElementById('cmdInput');
  if (isBusy) {
    btn.textContent = '停止';
    btn.className = 'stop';
    btn.title = '停止当前运行（Ctrl+C）';
    input.disabled = true;
  } else {
    btn.textContent = '发送 ↵';
    btn.className = '';
    btn.title = '';
    input.disabled = false;
  }
}

// 启停：run→暂停 awf，pause→恢复 awf，idle/plan→启动 awf
function renderRunToggle(mode) {
  currentMode = mode || 'idle';
  const btn = document.getElementById('runToggle');
  if (currentMode === 'run') {
    btn.textContent = '暂停 awf';
    btn.className = 'run-toggle stop';
  } else if (currentMode === 'pause') {
    btn.textContent = '恢复 awf';
    btn.className = 'run-toggle start';
  } else {
    btn.textContent = '启动 awf';
    btn.className = 'run-toggle start';
  }
}

async function toggleRun() {
  await postCmd(currentMode === 'run' ? '/ai-workflow-core:w-pause' : '/ai-workflow-core:w-start');
}

// 智能自动滚动：在底部时自动跟随新内容，用户上翻则暂停，拉回底部再恢复
document.getElementById('output').addEventListener('scroll', () => {
  const out = document.getElementById('output');
  autoScroll = out.scrollHeight - out.scrollTop - out.clientHeight < 8;
});

setInterval(refresh, 2000);
refresh();
</script>
</body>
