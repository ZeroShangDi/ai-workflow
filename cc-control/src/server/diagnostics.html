<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWF Run — Diagnostics</title>
<style>
  :root { --bg:#0f1117; --panel:#161822; --border:#252836; --text:#c9d1d9; --dim:#6e7681; --accent:#58a6ff; --good:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif; }
  .topbar { display:flex; align-items:center; gap:14px; padding:13px 20px; background:var(--panel); border-bottom:1px solid var(--border); }
  .topbar h1 { margin:0; font-size:16px; } .topbar a { color:var(--accent); text-decoration:none; font-size:13px; } .topbar span { color:var(--dim); font-size:12px; }
  main { max-width:1180px; margin:0 auto; padding:24px 20px 40px; } h2 { margin:0 0 12px; font-size:14px; } .intro { color:var(--dim); margin:0 0 20px; }
  .summary { display:grid; grid-template-columns:1.45fr repeat(3, 1fr); gap:10px; margin-bottom:20px; } .card { border:1px solid var(--border); border-radius:10px; background:var(--panel); padding:14px; min-width:0; }
  .label { color:var(--dim); font-size:11px; letter-spacing:.7px; text-transform:uppercase; } .value { margin-top:5px; font-size:22px; font-weight:700; } .meta { margin-top:4px; color:var(--dim); font-size:12px; }
  .result { border-left:3px solid var(--accent); } .result.healthy { border-color:var(--good); } .result.watch { border-color:var(--warn); } .result.attention { border-color:var(--bad); }
  .result-title { display:flex; gap:10px; align-items:center; } .badge { padding:1px 8px; border-radius:999px; background:#263143; color:var(--accent); font-size:11px; } .result p { margin:9px 0 0; color:var(--text); }
  .findings { display:grid; gap:10px; } .finding { border:1px solid var(--border); border-radius:9px; padding:14px; background:rgba(255,255,255,.015); } .finding h3 { margin:0 0 8px; font-size:14px; } .finding p { margin:5px 0; color:var(--dim); } .finding strong { color:var(--text); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:20px; } .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); } .row:last-child { border-bottom:0; } .row span:first-child { color:var(--dim); } .gap-list { margin:0; padding-left:18px; color:var(--dim); }
  .empty { border:1px dashed var(--border); border-radius:10px; padding:18px; color:var(--dim); } button { border:0; border-radius:7px; padding:8px 12px; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#061526; } button:disabled { opacity:.6; cursor:wait; }
  @media (max-width:800px) { .summary, .grid { grid-template-columns:1fr 1fr; } .summary .card:first-child { grid-column:span 2; } } @media (max-width:520px) { .summary, .grid { grid-template-columns:1fr; } .summary .card:first-child { grid-column:auto; } }
</style>
</head>
<body>
<header class="topbar"><a href="/">← 返回总览</a><h1>本次运行诊断</h1><span id="status">读取中…</span></header>
<main>
  <p class="intro">AI 结论只基于本页快照数据。数据不完整时会明确标注，不将推断当作事实。</p>
  <section class="summary" id="summary"></section>
  <section id="diagnosis"></section>
  <section class="grid"><div class="card"><h2>Token 明细</h2><div id="tokens"></div></div><div class="card"><h2>统计范围</h2><div id="coverage"></div></div></section>
</main>
<script>
function n(value) { if (typeof value !== 'number' || !Number.isFinite(value)) return '—'; return value >= 1000 ? (value / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(value)); }
function time(ms) { if (typeof ms !== 'number') return '—'; const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? h + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m ? m + 'm ' + String(s % 60).padStart(2, '0') + 's' : s + 's'; }
function esc(value) { const node = document.createElement('span'); node.textContent = String(value || ''); return node.innerHTML; }
function card(label, value, meta) { return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="meta">${meta || ''}</div></div>`; }
function rows(items) { return items.map(([label, value]) => `<div class="row"><span>${label}</span><strong>${value}</strong></div>`).join(''); }
function render(metrics, record) {
  const throughput = metrics.outputSpeed.currentTokensPerSecond || metrics.outputSpeed.averageTokensPerSecond;
  const throughputMeta = metrics.outputSpeed.basis === 'recent_60s' ? '最近 60s 端到端吞吐' : '全程端到端吞吐';
  document.getElementById('summary').innerHTML = [
    card('总 Token', n(metrics.tokens.total), `输入 ${n(metrics.tokens.input)} · 输出 ${n(metrics.tokens.output)}`),
    card('端到端吞吐', throughput ? throughput.toFixed(2) + ' tok/s' : '—', `${throughputMeta} · 不等同模型流式速度`),
    card('总耗时', time(metrics.elapsedMs), `当前 ${metrics.activeAgents} 个 Agent 运行中`),
    card('上下文', metrics.context.usedPercentage == null ? '—' : metrics.context.usedPercentage + '%', `${n(metrics.context.totalInputTokens)}/${n(metrics.context.contextWindowSize)} tokens`),
  ].join('');
  document.getElementById('tokens').innerHTML = rows([['输入', n(metrics.tokens.input)], ['输出', n(metrics.tokens.output)], ['缓存读取', n(metrics.tokens.cacheReadInput)], ['缓存写入', n(metrics.tokens.cacheCreationInput)], ['合计（不含缓存）', n(metrics.tokens.total)]]);
  document.getElementById('coverage').innerHTML = rows([['Agent 模式', metrics.agentMode === 'multi' ? '多 Agent' : '单 Agent'], ['统计状态', metrics.tokens.coverage], ['已覆盖 transcript', metrics.tokens.coveredTranscripts + '/' + metrics.tokens.totalTranscripts], ['未提供子 Agent transcript', metrics.tokens.missingSubagentTranscripts], ['运行中 Agent', metrics.activeAgents + '/' + metrics.maxAgents]]);
  const root = document.getElementById('diagnosis');
  if (!record) { root.innerHTML = `<div class="empty">尚未生成 AI 诊断。<p><button onclick="requestDiagnosis(this)">诊断本次运行</button></p></div>`; return; }
  if (record.status === 'running') { root.innerHTML = '<div class="empty">AI 正在基于当前快照诊断本次运行。此页会自动刷新。</div>'; return; }
  if (record.status === 'failed') { root.innerHTML = `<div class="empty">诊断失败：${esc(record.error)}<p><button onclick="requestDiagnosis(this)">重新诊断</button></p></div>`; return; }
  const d = record.diagnosis;
  root.innerHTML = `<div class="card result ${esc(d.severity)}"><div class="result-title"><h2>AI 诊断结论</h2><span class="badge">${esc(d.severity)}</span></div><p>${esc(d.summary)}</p></div><div class="findings" style="margin-top:12px">${d.findings.map(item => `<article class="finding"><h3>${esc(item.title)}</h3><p><strong>证据：</strong>${esc(item.evidence)}</p><p><strong>影响：</strong>${esc(item.impact)}</p><p><strong>建议：</strong>${esc(item.recommendation)}</p></article>`).join('')}</div>${d.dataGaps.length ? `<div class="card" style="margin-top:12px"><h2>数据缺口</h2><ul class="gap-list">${d.dataGaps.map(item => '<li>' + esc(item) + '</li>').join('')}</ul></div>` : ''}`;
}
async function requestDiagnosis(button) { button.disabled = true; const res = await fetch('/awf/diagnostics', { method:'POST' }); if (!res.ok) { const data = await res.json().catch(() => ({})); alert(data.error || '诊断提交失败'); button.disabled = false; return; } load(); }
async function load() { try { const [m, d] = await Promise.all([fetch('/awf/metrics'), fetch('/awf/diagnostics')]); const metrics = (await m.json()).metrics; const record = (await d.json()).diagnosis; document.getElementById('status').textContent = record ? (record.status === 'complete' ? '已完成' : record.status === 'running' ? '分析中' : '失败') : '未诊断'; render(metrics, record); if (record && record.status === 'running') setTimeout(load, 2000); } catch { document.getElementById('status').textContent = '读取失败'; } }
load();
</script>
</body>
</html>
